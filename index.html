    <link rel="apple-touch-icon" sizes="180x180" href="/icon.png" />

    <title>Alux</title>
    <!-- jsPDF para generación de PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
      (function () {
        if (sessionStorage.getItem('luxes-asset-reload')) return;
        window.addEventListener('error', function (event) {
          var target = event.target;
          if (!target || target.tagName !== 'SCRIPT') return;
          sessionStorage.setItem('luxes-asset-reload', '1');
          var clear = ('caches' in window)
            ? caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (key) { return caches.delete(key); }));
              })
            : Promise.resolve();
          clear.then(function () { window.location.reload(); });
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <div id="overlay-root"></div>
    <div id="toast-root"></div>
    <script type="module" src="/src/app/main.jsx"></script>
  </body>
